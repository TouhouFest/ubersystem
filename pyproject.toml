[project]
name = "ubersystem"
version = "0.1.0"
description = "Event registration and management system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.16.4",
    "authorizenet @ git+https://github.com/magfest/sdk-python.git@d8f30cff62234005d634864887604093f221b4a5",
    "aztec-code-generator==0.11",
    "bcrypt==4.3.0",
    "bleach==6.2.0",
    "boto3==1.39.4",
    "celery==5.5.3",
    "checkdigit==0.5.0",
    "cherrypy==18.10.0",
    "configobj==5.0.9",
    "email-validator==2.2.0",
    "fpdf2==2.8.3",
    "geopy==2.4.1",
    "ics==0.7.2",
    "jinja2==3.1.6",
    "ortools==9.14.6206",
    "phonenumbers==9.0.9",
    "pillow==11.3.0",
    "psutil",
    "psycopg2-binary==2.9.10",
    "pycountry==24.6.1",
    "pypsutil==0.2.0",
    "python-barcode[images]==0.15.1",
    "python-dateutil==2.9.0.post0",
    "python-jose[cryptography]==3.5.0",
    "python3-saml==1.16.0",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "redis==6.2.0",
    "requests==2.32.4",
    "rpctools @ git+https://github.com/appliedsec/rpctools.git@4e4108c3b7b4b6c482e515b1eeea2d79568cf065",
    "sentry-sdk==2.32.0",
    "signnow-python-sdk==2.0.1",
    "sqlalchemy==2.0.46",
    "sqlmodel==0.0.37",
    "stripe==9.1.0",
    "tatsu==5.16",
    "twilio==9.6.5",
    "uszipcode==1.0.1",
    "wtforms==3.2.1",
    "xlsxwriter==3.2.5",
    "xmlsec==1.3.16",
]

[project.optional-dependencies]
test = [
    "pytest>=3.0.1",
    "mock>=1.0.1,<1.1",
    "coverage>=3.6",
]
locust = [
    "locust @ git+https://github.com/locustio/locust",
    "faker>=0.7.11",
]

[dependency-groups]
dev = [
    "pytest>=3.0.1",
    "mock>=1.0.1,<1.1",
    "coverage>=3.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
